name: Build PS2 ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps2dev/ps2dev:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          apk update
          apk add --no-cache make xorriso
          ln -s /usr/bin/xorrisofs /usr/bin/genisoimage

      - name: Compile PS2 Project
        run: |
          make

      - name: Package Bootable ISO
        run: |
          printf "BOOT2 = cdrom0:\\\\GRAYS-HARBOR.ELF;1
VER = 1.00
VMODE = NTSC
" > SYSTEM.CNF
          cp grays-harbor.elf GRAYS-HARBOR.ELF
          genisoimage -iso-level 1 -o grays-harbor.iso SYSTEM.CNF GRAYS-HARBOR.ELF

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: grays-harbor-iso
          path: grays-harbor.iso
