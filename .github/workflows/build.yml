name: Build PS2 ISO
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps2dev/ps2dev:alpine
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install Build Tools
        run: |
          apk update && apk add make genisoimage xorriso
      - name: Compile PS2 Project
        run: make
      - name: Create ISO Package
        run: |
          mkdir -p iso_root
          cp shadow_county.elf iso_root/GRAYS-HARBOR.ELF
          echo "BOOT = cdrom0:\GRAYS-HARBOR.ELF;1" > iso_root/SYSTEM.CNF
          echo "VER = 1.00" >> iso_root/SYSTEM.CNF
          echo "VMODE = NTSC" >> iso_root/SYSTEM.CNF
          genisoimage -o grays-harbor.iso -volid "GRAYS_HARBOR" -joliet -rational-rock iso_root/
      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: grays-harbor-iso
          path: grays-harbor.iso
